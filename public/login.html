<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Cassino Royale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #030712;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(217, 119, 6, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(30, 58, 138, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(126, 34, 206, 0.3) 0%, transparent 60%);
            font-family: 'Urbanist', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 50%, #020617 100%);
            border: 5px solid;
            border-image: linear-gradient(to bottom, #fde047, #ca8a04, #713f12) 1;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 40px rgba(234, 179, 8, 0.3);
            position: relative;
        }

        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            background: linear-gradient(to right, #fef08a, #facc15, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }
        .auth-header p { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .banner-bonus {
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.15), rgba(202, 138, 4, 0.25));
            border: 2px dashed #facc15;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.2);
        }
        .banner-bonus h3 { font-size: 14px; color: #facc15; font-weight: 800; text-transform: uppercase; }
        .banner-bonus span { font-size: 12px; color: #fde047; font-weight: 600; }

        .tabs {
            display: flex;
            background: #020617;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab.active {
            background: #facc15;
            color: #000;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus { border-color: #facc15; box-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(234, 179, 8, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { filter: brightness(1.15); transform: translateY(-2px); }

        .form-section { display: none; }
        .form-section.active { display: block; }

        /* Modal de Sucesso Customizado */
        #modalSucessoRegistro {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-conteudo {
            background: linear-gradient(145deg, #1e1b4b, #0f172a);
            border: 4px solid #4ade80;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 50px rgba(74, 222, 128, 0.5);
            animation: modalEntrada 0.3s ease-out;
        }
        @keyframes modalEntrada {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Som de Festa / Moedas para o Cadastro -->
    <audio id="som-festa" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>

    <!-- Modal de Parabéns Bem Visível -->
    <div id="modalSucessoRegistro">
        <div class="modal-conteudo">
            <div style="font-size: 55px; margin-bottom: 10px;">🎉🥳</div>
            <h2 style="font-family: 'Playfair Display', serif; font-size: 24px; color: #facc15; margin-bottom: 10px; text-transform: uppercase;">Parabéns!</h2>
            <p style="font-size: 16px; color: #fff; font-weight: 700; margin-bottom: 15px;">Você ganhou <span style="color: #4ade80; font-size: 22px;">R$ 100,00</span> de bônus na sua conta!</p>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Redirecionando para o cassino...</p>
            <button onclick="irParaCassino()" style="width: 100%; background: #4ade80; color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 900; text-transform: uppercase; cursor: pointer;">Começar a Jogar 🚀</button>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="banner-bonus">
                <h3><i class="fa-solid fa-gift"></i> Primeiro Cadastro Ganha</h3>
                <span>R$ 100,00 de Bônus na Hora!</span>
            </div>
            <h1>Cassino Royale</h1>
            <p>Portal Oficial de Jogos</p>
        </div>

        <div class="tabs">
            <button class="tab active" id="tabEntrar" onclick="alternarAba('entrar')">Entrar</button>
            <button class="tab" id="tabCriar" onclick="alternarAba('criar')">Criar Conta</button>
        </div>

        <!-- Formulário de Login -->
        <div id="secaoEntrar" class="form-section active">
            <div class="form-group">
                <label>Número de Telefone</label>
                <input type="text" id="loginTelefone" class="form-control" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label>Sua Senha</label>
                <input type="password" id="loginSenha" class="form-control" placeholder="••••••••">
            </div>
            <button class="btn-submit" onclick="fazerLogin()">Acessar Conta ⚡</button>
        </div>

        <!-- Formulário de Cadastro -->
        <div id="secaoCriar" class="form-section">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="cadNome" class="form-control" placeholder="Seu nome completo">
            </div>
            <div class="form-group">
                <label>Número de Telefone</label>
                <input type="text" id="cadTelefone" class="form-control" placeholder="(00) 00000-0000">
            </div>
            <div class="form-group">
                <label>Criar Senha</label>
                <input type="password" id="cadSenha" class="form-control" placeholder="Sua senha secreta">
            </div>
            <button class="btn-submit" onclick="fazerCadastro()">Cadastrar e Ganhar R$ 100 🎁</button>
        </div>
    </div>

    <script>
        const somFesta = document.getElementById('som-festa');
        let proximaPaginaUrl = 'index.html';

        function alternarAba(tipo) {
            if (tipo === 'entrar') {
                document.getElementById('tabEntrar').classList.add('active');
                document.getElementById('tabCriar').classList.remove('active');
                document.getElementById('secaoEntrar').classList.add('active');
                document.getElementById('secaoCriar').classList.remove('active');
            } else {
                document.getElementById('tabCriar').classList.add('active');
                document.getElementById('tabEntrar').classList.remove('active');
                document.getElementById('secaoCriar').classList.add('active');
                document.getElementById('secaoEntrar').classList.remove('active');
            }
        }

        function fazerCadastro() {
            const nome = document.getElementById('cadNome').value;
            const telefone = document.getElementById('cadTelefone').value;
            const senha = document.getElementById('cadSenha').value;

            if (!nome || !telefone || !senha) {
                alert("Por favor, preencha todos os campos para se cadastrar!");
                return;
            }

            fetch('/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, telefone, senha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    // Salva os dados do usuário logado no navegador
                    localStorage.setItem('usuarioId', data.usuario.id);
                    localStorage.setItem('usuarioNome', data.usuario.nome);

                    // Exibe o modal de parabéns bem visível
                    document.getElementById('modalSucessoRegistro').style.display = 'flex';

                    // Dispara fogos de artifício/confetes na tela inteira
                    confetti({
                        particleCount: 200,
                        spread: 120,
                        origin: { y: 0.5 }
                    });

                    // Toca o som de festa/vitória
                    somFesta.currentTime = 0;
                    somFesta.play().catch(e => console.log("Áudio bloqueado pelo navegador:", e));

                    // Redireciona automaticamente após 4 segundos se o usuário não clicar no botão
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 4000);
                } else {
                    alert(data.mensagem || "Erro ao criar conta.");
                }
            })
            .catch(() => alert("Erro de conexão com o servidor."));
        }

        function irParaCassino() {
            window.location.href = 'index.html';
        }

        function fazerLogin() {
            const telefone = document.getElementById('loginTelefone').value;
            const senha = document.getElementById('loginSenha').value;

            if (!telefone || !senha) {
                alert("Preencha o telefone e a senha!");
                return;
            }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telefone, senha })
            })
            .then(res => res.json())
            .then(data => {
                if (data.sucesso) {
                    localStorage.setItem('usuarioId', data.usuario.id);
                    localStorage.setItem('usuarioNome', data.usuario.nome);
                    window.location.href = 'index.html';
                } else {
                    alert(data.mensagem || "Telefone ou senha incorretos.");
                }
            })
            .catch(() => alert("Erro de conexão ao fazer login."));
        }
    </script>
</body>
</html>
